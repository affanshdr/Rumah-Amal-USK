<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b6330"/>
      <stop offset="60%" stop-color="#084823"/>
      <stop offset="100%" stop-color="#053017"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#e6b400"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <rect width="600" height="800" fill="url(#glow)"/>

  <!-- Decorative Pattern Lines -->
  <path d="M-100 200 L700 -200" stroke="rgba(255,255,255,0.05)" stroke-width="60"/>
  <path d="M-100 400 L700 0" stroke="rgba(255,255,255,0.04)" stroke-width="80"/>
  <path d="M-100 600 L700 200" stroke="rgba(255,255,255,0.03)" stroke-width="100"/>

  <!-- Gold Top Accent Line -->
  <rect x="0" y="0" width="600" height="12" fill="url(#goldGrad)"/>

  <!-- Document Card Frame Inside Cover -->
  <rect x="50" y="60" width="500" height="680" rx="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="70" y="80" width="460" height="640" rx="16" fill="rgba(0,0,0,0.15)"/>

  <!-- Icon Container -->
  <g transform="translate(300, 320)">
    <circle cx="0" cy="0" r="75" fill="rgba(255,255,255,0.1)"/>
    <circle cx="0" cy="0" r="70" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- PDF Document Icon -->
    <path d="M-22 -32 L10 -32 L26 -16 L26 32 C26 35.3 -22 35.3 -22 35.3 L-22 -32 Z" fill="#084823"/>
    <path d="M10 -32 L10 -16 L26 -16 Z" fill="#053017"/>
    <!-- Folded Corner Lines -->
    <rect x="-14" y="-12" width="22" height="4" rx="2" fill="#ffffff"/>
    <rect x="-14" y="-2" width="28" height="4" rx="2" fill="#ffffff"/>
    <rect x="-14" y="8" width="28" height="4" rx="2" fill="#ffffff"/>
    <rect x="-14" y="18" width="18" height="4" rx="2" fill="#ffffff"/>
  </g>

  <!-- Header Text -->
  <text x="300" y="470" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
    RUMAH AMAL USK
  </text>
  <text x="300" y="505" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="18" fill="url(#goldGrad)" letter-spacing="4">
    DOKUMEN RESMI
  </text>

  <!-- Decorative Footer Line -->
  <line x1="200" y1="540" x2="400" y2="540" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Footer Info -->
  <text x="300" y="650" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="14" fill="rgba(255,255,255,0.7)">
    Rumah Amal Masjid Jamik Universitas Syiah Kuala
  </text>
</svg>
